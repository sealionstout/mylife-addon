name: myLife Dashboard
version: "0.1.5"
slug: mylife
description: Personal life dashboard backend — aggregates Home Assistant + BL101 into one live view.
url: https://github.com/sealionstout/mylife-addon
arch:
  - aarch64
  - amd64
init: false
# Grant access to the HA Core API via the Supervisor proxy (no manual token needed)
homeassistant_api: true
hassio_api: true
# Expose the dashboard on the home network
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: myLife dashboard web UI
map:
  - share:rw            # persist SQLite in /share so it survives add-on updates
options:
  bl101_domain: "www.bl101.com"
  kids:
    - name: Brady
      size: YL
    - name: Beau
      size: YM
    - name: Logan
      size: YS
  ha_poll_seconds: 180
  bl101_poll_hours: 24
  health_ingest_token: ""
schema:
  bl101_domain: str
  kids:
    - name: str
      size: str
  ha_poll_seconds: int
  bl101_poll_hours: int
  health_ingest_token: str?
